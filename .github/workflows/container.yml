name: Container

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: HTTPS URL of the exact Nunulo APK release artifact
        required: true
        type: string
      apk_sha256:
        description: Lowercase SHA-256 of the APK
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          target=release-site/public/downloads/nunulo-android-0.1.0-personal.2.apk
          curl --fail --location --proto '=https' --tlsv1.2 "$APK_URL" --output "$target"
          printf '%s  %s\n' "$APK_SHA256" "$(basename "$target")" > release-site/public/downloads/nunulo-android-0.1.0-personal.2.sha256
          (cd release-site/public/downloads && sha256sum --check nunulo-android-0.1.0-personal.2.sha256)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nunulo/nunulo-site:latest
            ghcr.io/nunulo/nunulo-site:${{ github.sha }}
